<div class="board-frame">
  <div class="files" aria-hidden="true">
    @for (file of files(); track file) { <span>{{ file }}</span> }
  </div>
  <div class="board-row">
    <div class="ranks" aria-hidden="true">
      @for (rank of ranks(); track rank) { <span>{{ rank }}</span> }
    </div>
    <div class="board" role="group" aria-label="Chessboard">
      @for (square of squares(); track square.index.value) {
        <button type="button" class="square"
          [class.dark]="square.dark"
          [class.dragging]="draggedSquare()?.value === square.index.value"
          [class.drop-target]="dropTarget()?.value === square.index.value"
          [attr.data-square]="square.name"
          [attr.aria-label]="square.name + ', ' + pieceLabel(board().getPieceAt(square.index))"
          [draggable]="dragEnabled() && board().getPieceAt(square.index) !== none"
          (click)="activate(square.index)"
          (mousedown)="beginPaint($event, square.index)"
          (mouseenter)="continuePaint($event, square.index)"
          (dragstart)="startDrag($event, square.index)"
          (dragover)="dragOver($event, square.index)"
          (dragleave)="dropTarget.set(null)"
          (drop)="drop($event, square.index)"
          (dragend)="cancelInteraction()">
          @if (board().getPieceAt(square.index) !== none) {
            <app-chess-piece [piece]="board().getPieceAt(square.index)" />
          }
        </button>
      }
    </div>
  </div>
</div>
