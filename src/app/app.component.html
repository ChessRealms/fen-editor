<main>
  <header>
    <h1>FEN Editor</h1>
    <p>Choose a piece to place it. Use Move to drag pieces, or Erase to remove them.</p>
  </header>

  <section class="editor" aria-label="Position editor">
    <div class="palette" role="group" aria-label="Black pieces">
      @for (piece of blackPieces; track piece.value) {
        <button type="button" class="piece-tool" draggable="true"
          [attr.aria-label]="'Place ' + piece.label"
          [attr.aria-pressed]="tool() === piece.value"
          (click)="selectTool(piece.value)"
          (dragstart)="startPaletteDrag($event, piece.value)"
          (dragend)="draggedPiece.set(null)">
          <app-chess-piece [piece]="piece.value" />
        </button>
      }
    </div>

    <app-chess-board [board]="board()" [dragEnabled]="tool() === null"
      [paintEnabled]="tool() !== null"
      (squareActivated)="place($event)"
      (pieceMoved)="move($event)"
      (paletteDropped)="dropPalettePiece($event)" />

    <div class="palette" role="group" aria-label="White pieces">
      @for (piece of whitePieces; track piece.value) {
        <button type="button" class="piece-tool" draggable="true"
          [attr.aria-label]="'Place ' + piece.label"
          [attr.aria-pressed]="tool() === piece.value"
          (click)="selectTool(piece.value)"
          (dragstart)="startPaletteDrag($event, piece.value)"
          (dragend)="draggedPiece.set(null)">
          <app-chess-piece [piece]="piece.value" />
        </button>
      }
    </div>

    <div class="tools" role="group" aria-label="Board tools">
      <button type="button" [attr.aria-pressed]="tool() === null" (click)="selectTool(null)">
        <img src="assets/hand.svg" alt="" width="22" height="22" /> Move
      </button>
      <button type="button" [attr.aria-pressed]="tool() === erase" (click)="selectTool(erase)">
        <img src="assets/trash-bucket.svg" alt="" width="22" height="22" /> Erase
      </button>
    </div>

    <label for="placement">Piece placement</label>
    <input id="placement" [value]="placement()" readonly aria-describedby="placement-help" spellcheck="false" />
    <p id="placement-help" class="hint">Piece placement only. Select the text to copy it.</p>
  </section>
</main>
